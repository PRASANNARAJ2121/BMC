name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test
      - name: Run Playwright E2E tests
        run: npx playwright install && npx playwright test --project=chromium
      - name: Build production bundle
        run: npm run build
      - name: Build Docker image
        run: |
          docker build -t bmc-platform:latest .

